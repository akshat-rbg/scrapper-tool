services:                                                                                                                                                                               
    scrapper:
      build: .                                                                                                                                                                            
      image: scrapper:latest
      container_name: scrapper
      restart: unless-stopped
      ports:                                                                                                                                                                              
        - "8001:8000"
      environment:                                                                                                                                                                        
        - PORT=8000
      shm_size: "1gb"
      mem_limit: 2g                                                                                                                                                                       
      cpus: 1.5
      healthcheck:                                                                                                                                                                        
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 30s                                                                                                                                                                     
        timeout: 10s                                                                                                                                                                      
        retries: 3
        start_period: 30s                                                                                                                                                                 
      logging:    
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"                                                                                                                                                                   