services:
  scraper:
    build: .
    container_name: scraper
    restart: unless-stopped
    ports:
      - '9000:9000'
    environment:
      - PORT=9000
    shm_size: 1gb
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - http://localhost:9000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
